{{- if .Values.postgresql.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgresql.auth.existingSecret }}
  labels:
    app: paperless-ngx
type: Opaque
data:
  POSTGRES_PASSWORD: {{ .Values.POSTGRES_PASSWORD | b64enc | quote }}
  APP_DB_PASSWORD: {{ .Values.APP_DB_PASSWORD | b64enc | quote }}
  DB_PASSWORD: {{ .Values.APP_DB_PASSWORD | b64enc | quote }}
{{- end }}
