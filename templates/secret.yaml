{{- /*
Optionally create paperless application secret from values.
If secrets.create=true, this creates a Kubernetes Secret with admin credentials.

For production with external secret management (1Password, External Secrets, etc.),
set secrets.create=false and ensure the 'paperless-secret' Secret exists by other means.

Required secret keys:
  - PAPERLESS_ADMIN_USER
  - PAPERLESS_ADMIN_PASSWORD
  - PAPERLESS_SECRET_KEY
*/ -}}

{{- if .Values.secrets.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.secretName }}
  namespace: {{ .Values.global.namespaceOverride | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: paperless
type: Opaque
stringData:
  PAPERLESS_ADMIN_USER: {{ .Values.secrets.adminUser | quote }}
  PAPERLESS_ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  PAPERLESS_SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
{{- end }}
