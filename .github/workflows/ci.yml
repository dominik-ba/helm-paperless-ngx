name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Fork PRs run with a read-only token and no secrets. Keep it that way:
# never switch this workflow to pull_request_target.
permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Build dependencies (from Chart.lock)
        run: helm dependency build .

      - name: Lint chart (strict)
        run: helm lint . --strict

      - name: Template chart (default values)
        run: |
          helm template paperless . \
            --namespace paperless \
            > /tmp/paperless-rendered.yaml

      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin

      - name: Validate Kubernetes manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            /tmp/paperless-rendered.yaml

      - name: Check for plaintext secrets
        run: |
          if grep -A 5 "kind: Secret" /tmp/paperless-rendered.yaml \
              | grep -E "^\s+(password|token|apikey|api-key|secret):" \
              | grep -v "{{"; then
            echo "ERROR: Found potential plaintext secrets in rendered output"
            exit 1
          fi
          echo "OK: No plaintext secrets found"

      - name: Template chart (secrets.create=true for linting)
        run: |
          helm template paperless . \
            --namespace paperless \
            --set secrets.create=true \
            --set postgresql.createSecret=true \
            > /tmp/paperless-with-secrets.yaml

      - name: Validate with secrets enabled
        run: |
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            /tmp/paperless-with-secrets.yaml

      - name: Template chart (all optional features enabled)
        run: |
          helm template paperless . \
            --namespace paperless \
            --set gotenberg.enabled=true \
            --set tika.enabled=true \
            --set ingress.enabled=true \
            --set 'ingress.hosts[0].host=paperless.example.com' \
            --set 'persistence.consume.enabled=true' \
            --set 'persistence.data.enabled=true' \
            --set 'persistence.export.enabled=true' \
            --set 'persistence.media.enabled=true' \
            > /tmp/paperless-full.yaml

      - name: Validate full render
        run: |
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            /tmp/paperless-full.yaml
