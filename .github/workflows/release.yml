name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write  # required for creating GitHub Releases
  packages: write  # required for pushing to ghcr.io

jobs:
  release:
    name: Package & Publish OCI Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.1

      - name: Extract version from tag
        id: version
        run: |
          # Strip leading 'v' from the tag (v0.2.0 → 0.2.0)
          echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Verify Chart.yaml version matches tag
        run: |
          chart_version=$(grep '^version:' Chart.yaml | awk '{print $2}')
          tag_version="${{ steps.version.outputs.version }}"
          if [ "$chart_version" != "$tag_version" ]; then
            echo "ERROR: Chart.yaml version ($chart_version) does not match tag ($tag_version)"
            exit 1
          fi
          echo "OK: Chart version $chart_version matches tag"

      - name: Update dependencies
        run: helm dependency update .

      - name: Lint chart (strict)
        run: helm lint . --strict

      - name: Package chart
        run: |
          mkdir -p .cr-release-packages
          helm package . --destination .cr-release-packages/

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Push chart to OCI registry
        run: |
          helm push .cr-release-packages/paperless-${{ steps.version.outputs.version }}.tgz \
            oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: .cr-release-packages/*.tgz
          generate_release_notes: true
          body: |
            ## Installation

            ```bash
            helm install paperless oci://ghcr.io/${{ github.repository_owner }}/charts/paperless --version ${{ steps.version.outputs.version }}
            ```

            ## Upgrade

            ```bash
            helm upgrade paperless oci://ghcr.io/${{ github.repository_owner }}/charts/paperless --version ${{ steps.version.outputs.version }}
            ```
