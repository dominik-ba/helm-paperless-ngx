name: Release

# A release is driven by the `version:` in Chart.yaml: whenever main contains a
# chart version that has not been released yet, this workflow tags it, pushes the
# OCI artifact and creates a GitHub Release. Renovate bumps the chart version
# together with every dependency update (see renovate.json).
#
# Releases are immutable: a version that already has a tag or an OCI artifact is
# never pushed again. To change a released chart, bump the version.

on:
  push:
    branches:
      - main
    paths:
      - Chart.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Package & Publish OCI Chart
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the tag and the GitHub Release
      packages: write  # push to ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Read chart version
        id: version
        run: |
          version=$(awk '/^version:/ {print $2}' Chart.yaml | tr -d '"')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Chart version: $version"

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Check whether this version is already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          released=false
          if gh api "repos/${{ github.repository }}/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
            released=true
          fi
          if helm show chart "oci://ghcr.io/${{ github.repository_owner }}/charts/paperless" --version "$VERSION" >/dev/null 2>&1; then
            echo "OCI artifact paperless:$VERSION already exists"
            released=true
          fi
          echo "released=$released" >> "$GITHUB_OUTPUT"
          if [ "$released" = "true" ]; then
            echo "::notice::paperless $VERSION is already released, nothing to do (bump the version in Chart.yaml to release)"
          fi

      - name: Update dependencies
        if: steps.check.outputs.released == 'false'
        run: helm dependency build .

      - name: Lint chart (strict)
        if: steps.check.outputs.released == 'false'
        run: helm lint . --strict

      - name: Package chart
        if: steps.check.outputs.released == 'false'
        run: |
          mkdir -p .cr-release-packages
          helm package . --destination .cr-release-packages/

      - name: Push chart to OCI registry
        if: steps.check.outputs.released == 'false'
        run: |
          helm push .cr-release-packages/paperless-${{ steps.version.outputs.version }}.tgz \
            oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Create tag and GitHub Release
        if: steps.check.outputs.released == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: .cr-release-packages/*.tgz
          generate_release_notes: true
          body: |
            ## Installation

            ```bash
            helm install paperless oci://ghcr.io/${{ github.repository_owner }}/charts/paperless --version ${{ steps.version.outputs.version }}
            ```

            ## Upgrade

            ```bash
            helm upgrade paperless oci://ghcr.io/${{ github.repository_owner }}/charts/paperless --version ${{ steps.version.outputs.version }}
            ```
