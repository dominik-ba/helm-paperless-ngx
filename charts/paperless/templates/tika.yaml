{{- if .Values.tika.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tika
  namespace: {{ .Values.global.namespaceOverride | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: tika
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tika
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tika
    spec:
      containers:
        - name: tika
          image: {{ .Values.tika.image.repository }}:{{ .Values.tika.image.tag }}
          ports:
            - containerPort: 9998
---
apiVersion: v1
kind: Service
metadata:
  name: tika
  labels:
    app.kubernetes.io/name: tika
spec:
  selector:
    app.kubernetes.io/name: tika
  ports:
    - name: http
      port: 9998
      targetPort: 9998
{{- end }}
